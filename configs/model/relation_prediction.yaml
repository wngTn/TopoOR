_target_: src.models.modules.relation_prediction.RelationPredictionModule
cell_dim: 256

backbone:
  _target_: src.models.backbones.CCMessagePassingTransformer
  in_features: "${model.cell_dim}"
  hidden_features: 256
  out_features: 256
  num_layers: 2
  heads: 8
  dropout: 0.1
  max_rank: 3
  max_time_steps: ${temporal_window}
  embed_dropout: 0.1

optimizer:
  _target_: torch.optim.Adam
  _partial_: True
  lr: 0.0001
  weight_decay: 0.0

scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  _partial_: True
  # Cosine horizon, independent of trainer.max_steps.
  T_max: 60000
  eta_min: 1e-6

metric:
  RelationPredictionMetrics:
    _target_: src.metrics.RelationPredictionMetrics

losses:
  _target_: src.losses.RelationPredictionLoss
