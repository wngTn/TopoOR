[project]
name = "TopoOR"
version = "0.1.0"
description = "TopoOR: A Unified Topological Scene Representation for the Operating Room"
readme = "README.md"

requires-python = ">=3.11.12,<3.12"

dependencies = [
  "einops==0.8.1",
  "hydra-core",
  "lightning>=2.5,<3.0",
  "opencv-python>=4.12.0.88",
  "prettytable>=3.12",
  "pytorch-warmup>=0.2.0",
  "rootutils",
  "scikit-learn>=1.8.0",
  "scipy>=1.17.0",
  "timm>=1.0.19",
  "torch==2.7.1+cu128",
  "torch-geometric>=2.6.1",
  "torchmetrics==1.7.2",
  "torchvision==0.22.1+cu128",
  "wandb>=0.22.2",
]

[dependency-groups]
dev = [
  "ruff",
  "pyright",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["E402"]

[tool.pyright]
reportUnboundVariable = "none"
include = ["src", "scripts"]
exclude = ["**/__pycache__", "./data", "./logs"]
